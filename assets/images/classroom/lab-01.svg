<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B18" />
      <stop offset="100%" stop-color="#0B0D0C" />
    </linearGradient>
    <radialGradient id="glow-lab" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E06A3B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E06A3B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg-lab)"/>
  <circle cx="1300" cy="350" r="450" fill="url(#glow-lab)"/>

  <!-- Circuit lines -->
  <path d="M200 300 H 600 V 450 H 900 V 350 H 1300" fill="none" stroke="#2D3530" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="450" r="8" fill="#E06A3B"/>
  <circle cx="900" cy="350" r="8" fill="#E06A3B"/>

  <rect x="50" y="50" width="1820" height="980" rx="24" fill="none" stroke="#E06A3B" stroke-width="2" stroke-dasharray="12 12" opacity="0.4"/>

  <g transform="translate(960, 480)" text-anchor="middle">
    <!-- Lightning / Circuit icon -->
    <circle cx="0" cy="-90" r="64" fill="#E06A3B"/>
    <path d="M-10 -125 L15 -95 L-5 -95 L10 -65 L-20 -90 L0 -90 Z" fill="#0B0D0C"/>

    <text y="40" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="#F2F4F2">
      Electrical Circuits & Lab Days
    </text>
    <text y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" fill="#E06A3B" font-weight="600">
      [ Landscape • 1920 × 1080 ]
    </text>
    <text y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" fill="#8A918A">
      assets/images/classroom/lab-01.jpg
    </text>
  </g>
</svg>
