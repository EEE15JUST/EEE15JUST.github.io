<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-class" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141815" />
      <stop offset="100%" stop-color="#0B0D0C" />
    </linearGradient>
    <radialGradient id="glow-class" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#E06A3B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E06A3B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg-class)"/>
  <circle cx="1250" cy="380" r="500" fill="url(#glow-class)"/>

  <!-- Classroom chalkboard & bench lines -->
  <rect x="180" y="240" width="1560" height="420" rx="16" fill="#181D1A" stroke="#2B322D" stroke-width="2"/>
  <line x1="240" y1="360" x2="800" y2="360" stroke="#3A443D" stroke-width="3" stroke-dasharray="16 10"/>
  <line x1="240" y1="420" x2="650" y2="420" stroke="#3A443D" stroke-width="3" stroke-dasharray="16 10"/>
  
  <rect x="50" y="50" width="1820" height="980" rx="24" fill="none" stroke="#E06A3B" stroke-width="2" stroke-dasharray="12 12" opacity="0.4"/>

  <g transform="translate(960, 480)" text-anchor="middle">
    <!-- Board / Presentation Icon -->
    <circle cx="0" cy="-90" r="64" fill="#E06A3B"/>
    <rect x="-30" y="-115" width="60" height="42" rx="4" fill="#0B0D0C"/>
    <line x1="-15" y1="-73" x2="15" y2="-73" stroke="#0B0D0C" stroke-width="4" stroke-linecap="round"/>

    <text y="40" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="#F2F4F2">
      Classroom & Lecture Hall Moments
    </text>
    <text y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" fill="#E06A3B" font-weight="600">
      [ Landscape • 1920 × 1080 ]
    </text>
    <text y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" fill="#8A918A">
      assets/images/classroom/classroom-01.jpg
    </text>
  </g>
</svg>
