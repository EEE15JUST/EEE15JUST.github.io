<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-portrait" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#EADBCE" />
    </linearGradient>
    <radialGradient id="sun-portrait" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#C85A32" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C85A32" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg-portrait)"/>
  <circle cx="350" cy="400" r="400" fill="url(#sun-portrait)"/>
  
  <!-- Architectural vertical arches mimicking study tour buildings -->
  <path d="M150,1920 L150,900 A390,390 0 0,1 930,900 L930,1920 Z" fill="#E8DCD0" opacity="0.5"/>
  <path d="M260,1920 L260,1050 A280,280 0 0,1 820,1050 L820,1920 Z" fill="#DCCBBB" opacity="0.6"/>
  
  <rect x="40" y="40" width="1000" height="1840" rx="30" fill="none" stroke="#C85A32" stroke-width="3" stroke-dasharray="14 14" opacity="0.4"/>

  <g transform="translate(540, 850)" text-anchor="middle">
    <!-- Map / Compass / Building Icon -->
    <circle cx="0" cy="-120" r="70" fill="#C85A32"/>
    <path d="M-25 -145 L0 -75 L25 -145 L0 -105 Z" fill="#FAF7F2"/>
    <path d="M-25 -95 L0 -165 L25 -95 L0 -135 Z" fill="#F4ECE1"/>

    <text y="30" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="#1E201E">
      Industrial Study Tour
    </text>
    <text y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" fill="#C85A32" font-weight="600">
      [ Portrait Format • 1080 × 1920 ]
    </text>
    <text y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" fill="#727572">
      Vertical photos render in natural proportions
    </text>
    <text y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#8C908C">
      assets/images/study-tour/tour-01.jpg
    </text>
  </g>
</svg>
