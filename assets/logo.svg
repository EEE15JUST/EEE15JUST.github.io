<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E201E"/>
      <stop offset="100%" stop-color="#2D302D"/>
    </linearGradient>
  </defs>
  <!-- Background circular badge -->
  <circle cx="100" cy="100" r="92" fill="url(#logo-grad)"/>
  
  <!-- Outer warm accent ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#C85A32" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
  
  <!-- Subtle circuit sine wave -->
  <path d="M40 100 Q 70 65, 100 100 T 160 100" fill="none" stroke="#C85A32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Text -->
  <text x="100" y="92" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#FAF7F2" text-anchor="middle" letter-spacing="1">
    EEE
  </text>
  <text x="100" y="128" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#C85A32" text-anchor="middle" letter-spacing="2">
    15
  </text>
</svg>
